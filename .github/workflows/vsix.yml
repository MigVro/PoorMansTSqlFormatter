name: VSIX

on:
  push:
    branches: [master]
    tags: ['[0-9]*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - name: Build
        run: msbuild PoorMansTSqlFormatterVSPackage\PoorMansTSqlFormatterVSPackage.csproj /restore /m /p:Configuration=Release /p:DeployExtension=false /v:minimal

      - uses: actions/upload-artifact@v4
        with:
          name: PoorMansTSqlFormatterVSPackage
          path: PoorMansTSqlFormatterVSPackage\bin\Release\PoorMansTSqlFormatterVSPackage.vsix

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: PoorMansTSqlFormatterVSPackage\bin\Release\PoorMansTSqlFormatterVSPackage.vsix
